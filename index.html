<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>⚽ サッカー試合管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:28px 20px 24px;font-size:26px;font-weight:800}
nav{position:sticky;top:0;z-index:20;background:#fff;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 2px 8px #0001}
nav button{border:0;background:white;padding:17px 4px;font-size:15px;font-weight:800;color:#2776df}
nav button.active{border-bottom:4px solid #2776df}
main{max-width:900px;margin:auto;padding:16px}
.tab{display:none}.tab.active{display:block}
.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 2px 10px #0000000d}
h2{margin:0 0 20px;font-size:25px}h3{margin:18px 0 10px}
label{display:block;font-weight:800;margin:12px 0 6px}
input,select,textarea{width:100%;border:2px solid #d1d5db;border-radius:12px;padding:13px;font-size:16px;background:white}
textarea{min-height:80px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.field{min-width:0}.field input,.field select{width:100%;min-width:0}
button{border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:800;background:#e5e7eb;color:#111827}
button.primary{background:#2776df;color:white}
button.danger{background:#fee2e2;color:#b91c1c}
button.small{padding:8px 10px;font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.player-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.player-row{display:flex;align-items:center;gap:8px;border:1px solid #e5e7eb;padding:9px;border-radius:10px}
.player-row span{flex:1;font-weight:700}
.pitch-wrap{overflow:hidden}
.pitch{position:relative;width:100%;max-width:650px;margin:auto;aspect-ratio:0.68;background:#3d6f2c;border:10px solid #d1d5db;border-radius:18px;overflow:hidden}
.field-line{position:absolute;border:2px solid rgba(255,255,255,.9);z-index:1;pointer-events:none}
.center-line{left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.9)}
.center-circle{left:50%;top:50%;width:22%;aspect-ratio:1;border:2px solid rgba(255,255,255,.9);border-radius:50%;transform:translate(-50%,-50%)}
.penalty-area{left:28%;width:44%;height:18%;border-top:0}
.penalty-area.top{top:0}
.penalty-area.bottom{bottom:0;border-top:2px solid rgba(255,255,255,.9);border-bottom:0}
.goal-area{left:40%;width:20%;height:8%}
.goal-area.top{top:0;border-top:0}
.goal-area.bottom{bottom:0;border-bottom:0}
.penalty-spot{left:50%;width:5px;height:5px;background:#fff;border-radius:50%;border:0;transform:translateX(-50%)}
.penalty-spot.top{top:12%}.penalty-spot.bottom{bottom:12%}
.position.dragging{opacity:.35;transform:translate(-50%,-50%) scale(.95)}
.position.drop-target{box-shadow:0 0 0 5px rgba(255,255,255,.8)}
.sub-marker{position:absolute;transform:translate(-50%,0);min-width:58px;max-width:88px;padding:3px 6px;border:1px dashed rgba(255,255,255,.75);border-radius:7px;background:rgba(255,255,255,.22);color:rgba(255,255,255,.92);font-size:10px;line-height:1.2;text-align:center;z-index:3;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;touch-action:manipulation}.sub-marker.filled{background:rgba(255,255,255,.72);color:#18320f;border-color:rgba(255,255,255,.95);font-weight:800}
.position{position:absolute;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;border:4px dashed #2452b8;background:#f0f3e8;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;z-index:2;cursor:pointer;user-select:none;touch-action:none}
.position.filled{border-style:solid;background:white}
.position small{display:block;font-size:11px}
.bench{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.slot{border:2px dashed #cbd5e1;border-radius:12px;padding:10px;min-height:46px;background:#f8fafc;text-align:center;font-weight:700}
.modal-back{position:fixed;inset:0;background:#0008;z-index:100;display:none;align-items:flex-end}
.modal-back.show{display:flex}
.modal{background:#fff;width:100%;max-height:75vh;border-radius:22px 22px 0 0;padding:18px;overflow:auto}
.modal button{width:100%;margin:5px 0;text-align:left;background:#f3f4f6}
.modal .close{background:#111827;color:white;text-align:center}
.saved-formation-box{margin-top:18px;border-top:1px solid #e5e7eb;padding-top:8px}.saved-formation-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}.saved-formation-list button{text-align:left;background:#f3f4f6}.saved-formation-list button strong{display:block}.history-item{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:10px 0}
.history-meta{color:#6b7280;font-size:13px}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;font-size:28px;font-weight:900}
.score input{font-size:28px;text-align:center}
.scorer-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin:8px 0}
.empty{color:#6b7280;text-align:center;padding:18px}
.notice{background:#eff6ff;border-radius:12px;padding:12px;font-size:14px}
@media(max-width:600px){
 header{font-size:23px;padding:24px 16px}
 main{padding:10px}
 .grid2{grid-template-columns:1fr 1fr}
 .player-list,.bench,.saved-formation-list{grid-template-columns:1fr}
 .position{width:64px;height:64px;font-size:13px}
}
</style>
</head>
<body>
<header>⚽ サッカー試合管理</header>
<nav>
<button data-tab="home" class="active">ホーム</button>
<button data-tab="players">選手</button>
<button data-tab="formation">配置</button>
<button data-tab="history">履歴</button>
<button data-tab="settings">設定</button>
</nav>

<main>
<section id="home" class="tab active">
<div class="card">
<h2>新しい試合</h2>

<label>大会名</label>
<select id="tournamentSelect"></select>
<input id="tournamentInput" placeholder="新しい大会名を入力">

<label>対戦相手</label>
<select id="opponentSelect"></select>
<input id="opponentInput" placeholder="新しい対戦相手を入力">

<div class="grid2">
<div class="field"><label>日付</label><input id="matchDate" type="date"></div>
<div class="field"><label>会場</label>
<select id="venueSelect"></select>
<div id="venueNewWrap"><input id="venueInput" placeholder="新しい会場を入力"></div>
</div>
</div>

<div class="grid2">
<div><label>人数</label><select id="playerCount">
<option>5</option><option>6</option><option selected>7</option><option>8</option><option>9</option><option>10</option><option>11</option>
</select></div>
<div><label>フォーメーション</label><select id="formationSelect"></select></div>
</div>

<label>スコア</label>
<div class="score"><input id="ourScore" type="number" min="0" value="0"><span>－</span><input id="oppScore" type="number" min="0" value="0"></div>

<label>得点者 <span style="font-weight:400;color:#6b7280">（選ぶと自動で自チーム得点が増えます）</span></label>
<div id="scorers"></div>
<button id="addScorer">＋ 得点者を追加</button>

<label>試合メモ</label><textarea id="matchMemo" placeholder="試合内容など"></textarea>
<div class="actions"><button class="primary" id="saveMatch">試合を保存</button></div>
</div>
</section>

<section id="players" class="tab">
<div class="card">
<h2>選手</h2>
<div class="notice">ここで登録したメンバーは自動保存され、アプリを閉じても残ります。</div>
<div class="actions">
<input id="newPlayer" placeholder="選手名">
<button class="primary" id="addPlayer">追加</button>
</div>
<div id="playerList" class="player-list" style="margin-top:14px"></div>
</div>
</section>

<section id="formation" class="tab">
<div class="card">
<h2>フォーメーション配置</h2>
<div class="grid2">
<div><label>人数</label><select id="formationCount">
<option>5</option><option selected>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option>
</select></div>
<div><label>形</label><select id="formationPreset"></select></div>
</div>
<p style="color:#6b7280;font-size:14px">空いている選手枠を<strong>1回タップ</strong>すると選手一覧が出ます。選手名を1回タップするだけで配置できます。</p>
<div class="pitch-wrap"><div id="pitch" class="pitch"></div></div>

<h3>交代予定（最大4人）</h3>
<div id="subSlots" class="bench" style="display:none"></div>
<div class="actions">
<button class="primary" id="saveFormation">この配置を保存</button>
<button id="clearFormation">配置をリセット</button>
</div>
<div id="savedFormationBox" class="saved-formation-box">
  <h3>保存したフォーメーション（直近5件）</h3>
  <div id="savedFormationList" class="saved-formation-list"></div>
</div>
<div style="font-size:13px;color:#6b7280;margin-top:10px">選手を長押しして別の選手の位置へ動かすと、2人を入れ替えられます。</div>
</div>
</section>

<section id="history" class="tab">
<div class="card"><h2>試合履歴</h2><div id="historyList"></div></div>
</section>

<section id="settings" class="tab">
<div class="card">
<h2>データ</h2>
<div class="actions">
<button id="exportData">バックアップを書き出す</button>
<button id="importData">バックアップを読み込む</button>
<input id="importFile" type="file" accept=".json" style="display:none">
<button class="danger" id="deleteData">全データ削除</button>
</div>
</div>
</section>
</main>

<div id="modalBack" class="modal-back">
<div class="modal">
<h3 id="modalTitle">選手を選択</h3>
<div id="modalPlayers"></div>
<button class="close" id="modalClose">キャンセル</button>
</div>
</div>

<script>
const KEY='soccerManagerV2';
function loadDB(){
  // まず今回のデータ形式を読む
  const v2=localStorage.getItem(KEY);
  if(v2){try{return JSON.parse(v2)}catch(e){}}
  // 以前の版は players / matches / formation という3つのキーを使っていたため、
  // 既存メンバーを引き継ぐ。
  const oldPlayers=JSON.parse(localStorage.getItem('players')||'[]');
  const oldMatches=JSON.parse(localStorage.getItem('matches')||'[]');
  const oldFormation=JSON.parse(localStorage.getItem('formation')||'null');
  return {
    players:oldPlayers.map((p,i)=>typeof p==='string'?p:(p?.name||'')).filter(Boolean),
    matches:Array.isArray(oldMatches)?oldMatches:[],
    currentFormation:oldFormation,
    savedFormations: oldFormation ? [{id:Date.now(),savedAt:Date.now(),count:oldFormation.count,preset:oldFormation.preset,slots:oldFormation.slots||[],subs:oldFormation.subs||[]}] : []
  };
}
let db=loadDB();
if(!Array.isArray(db.players)) db.players=[];
if(!Array.isArray(db.matches)) db.matches=[];
if(!Array.isArray(db.savedFormations)) db.savedFormations=db.currentFormation?[{id:Date.now(),savedAt:Date.now(),count:db.currentFormation.count,preset:db.currentFormation.preset,slots:db.currentFormation.slots||[],subs:db.currentFormation.subs||[]}]:[];
const today=new Date(); const yyyy=today.getFullYear(), mm=String(today.getMonth()+1).padStart(2,'0'), dd=String(today.getDate()).padStart(2,'0');
document.getElementById('matchDate').value=`${yyyy}-${mm}-${dd}`;

const PRESETS={
5:[['1-2-1',[['GK',50,88],['DF',32,68],['DF',68,68],['MF',50,48],['FW',50,20]]]],
6:[
['1-3-1',[['GK',50,88],['DF',50,70],['MF',20,47],['MF',50,47],['MF',80,47],['FW',50,20]]],
['1-2-2-1',[['GK',50,88],['DF',30,68],['DF',70,68],['MF',30,45],['MF',70,45],['FW',50,20]]]
],
7:[
['1-2-3-1',[['GK',50,88],['DF',30,68],['DF',70,68],['MF',20,47],['MF',50,47],['MF',80,47],['FW',50,20]]],
['1-3-2-1',[['GK',50,88],['DF',20,68],['DF',50,68],['DF',80,68],['MF',35,45],['MF',65,45],['FW',50,20]]]
],
8:[['1-3-3-1',[['GK',50,88],['DF',20,68],['DF',50,68],['DF',80,68],['MF',20,45],['MF',50,45],['MF',80,45],['FW',50,20]]]],
9:[['1-3-3-2',[['GK',50,88],['DF',20,68],['DF',50,68],['DF',80,68],['MF',20,45],['MF',50,45],['MF',80,45],['FW',38,22],['FW',62,22]]]],
10:[['1-3-4-1',[['GK',50,88],['DF',15,68],['DF',38,68],['DF',62,68],['DF',85,68],['MF',15,45],['MF',38,45],['MF',62,45],['MF',85,45],['FW',50,20]]]],
11:[['1-4-4-2',[['GK',50,88],['DF',12,68],['DF',37,68],['DF',63,68],['DF',88,68],['MF',12,45],['MF',37,45],['MF',63,45],['MF',88,45],['FW',38,20],['FW',62,20]]]]
};

let selectedCount=6;
let formationSlots=[];
let subSlots=[];

function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function unique(arr){return [...new Set(arr.filter(Boolean))]}
function playerOptions(includeBlank=true, used=[]){
 let out=includeBlank?'<option value="">選手を選択</option>':'';
 db.players.forEach(p=>{if(!used.includes(p))out+=`<option>${esc(p)}</option>`});
 return out;
}

function fillHistorySelects(){
 const recent=db.matches.slice(0,10);
 const t=unique(recent.map(x=>x.tournament)),o=unique(recent.map(x=>x.opponent)),v=unique(recent.map(x=>x.venue));
 setSelect('tournamentSelect',t,'大会名を選択');
 setSelect('opponentSelect',o,'対戦相手を選択');
 setSelect('venueSelect',v,'会場を選択');
}
function setSelect(id,arr,placeholder){
 const el=document.getElementById(id); el.innerHTML=`<option value="">${placeholder}</option><option value="__new">＋ 新しく入力</option>`+arr.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
}
['tournamentSelect','opponentSelect','venueSelect'].forEach(id=>{
 document.getElementById(id).addEventListener('change',e=>{
   const input=document.getElementById(id.replace('Select','Input'));
   if(id==='venueSelect'){
     document.getElementById('venueNewWrap').style.display=e.target.value==='__new'?'block':'none';
   }else{
     input.style.display=e.target.value==='__new'?'block':'none';
   }
   if(e.target.value && e.target.value!=='__new') input.value=e.target.value;
   else if(e.target.value==='') input.value='';
 });
});
function getField(selectId,inputId){const s=document.getElementById(selectId),i=document.getElementById(inputId);return s.value==='__new'||!s.value?i.value.trim():s.value}

function renderPlayers(){
 const el=document.getElementById('playerList');
 el.innerHTML=db.players.length?db.players.map((p,i)=>`<div class="player-row"><span>${i+1}. ${esc(p)}</span><button class="small danger" onclick="removePlayer(${i})">削除</button></div>`).join(''):'<div class="empty">まだ選手が登録されていません。</div>';
}
window.removePlayer=i=>{if(confirm(`${db.players[i]}を削除しますか？`)){db.players.splice(i,1);save();renderPlayers();renderFormation();renderScorers()}};

document.getElementById('addPlayer').onclick=()=>{
 const v=document.getElementById('newPlayer').value.trim(); if(!v)return;
 if(!db.players.includes(v))db.players.push(v);
 document.getElementById('newPlayer').value='';save();renderPlayers();renderFormation();renderScorers();
};

function presetData(count,name){
 if(name==='自由配置')return formationSlots.length?formationSlots:[{role:'GK',x:50,y:88}];
 const found=(PRESETS[count]||[]).find(x=>x[0]===name);
 return found?found[1].map(a=>({role:a[0],x:a[1],y:a[2],player:''})):[];
}
function fillFormationPresets(count){
 const sel=document.getElementById('formationPreset');
 const names=(PRESETS[count]||[]).map(x=>x[0]);
 sel.innerHTML=[...names,'自由配置'].map(x=>`<option>${x}</option>`).join('');
}
function resetFormation(){
 selectedCount=Number(document.getElementById('formationCount').value);
 fillFormationPresets(selectedCount);
 const name=document.getElementById('formationPreset').value;
 formationSlots=presetData(selectedCount,name);
 subSlots=Array(selectedCount).fill(null);
 renderFormation();
}
function renderFormation(){
 const pitch=document.getElementById('pitch');
 pitch.innerHTML=`
   <div class="field-line center-line"></div>
   <div class="field-line center-circle"></div>
   <div class="field-line penalty-area top"></div>
   <div class="field-line penalty-area bottom"></div>
   <div class="field-line goal-area top"></div>
   <div class="field-line goal-area bottom"></div>
   <div class="field-line penalty-spot top"></div>
   <div class="field-line penalty-spot bottom"></div>`;
 formationSlots.forEach((s,i)=>{
   const d=document.createElement('div');d.className='position '+(s.player?'filled':'');
   d.style.left=s.x+'%';d.style.top=s.y+'%';
   d.dataset.index=i;
   d.innerHTML=s.player?`<div>${esc(s.player)}<small>${esc(s.role)}</small></div>`:`<div>${i+1}<small>空き</small></div>`;
   d.onclick=()=>{if(suppressNextClick){suppressNextClick=false;return;}openPlayerModal(i,false)};
   d.onpointerdown=e=>startPositionDrag(e,i);
   pitch.appendChild(d);
   {
     const sub=document.createElement('div');
     sub.className='sub-marker '+(subSlots[i]?'filled':'');
     sub.style.left=s.x+'%';
     sub.style.top=Math.min(96,s.y+10)+'%';
     sub.textContent=subSlots[i]||'＋交代';
     sub.title=subSlots[i]||'交代予定を設定';
     sub.onclick=ev=>{ev.stopPropagation();openPlayerModal(i,true)};
     pitch.appendChild(sub);
   }
 });
 renderSubs();
 renderSavedFormations();
}

function renderSubs(){
 const el=document.getElementById('subSlots');el.innerHTML='';
 subSlots.forEach((p,i)=>{
   const b=document.createElement('button');b.className='slot';b.textContent=p||`＋ 交代予定 ${i+1}`;
   b.onclick=()=>openPlayerModal(i,true);el.appendChild(b);
 });
}
let dragIndex=null;
let dragPointerId=null;
let suppressNextClick=false;
function startPositionDrag(e,index){
 if(e.pointerType==='mouse' && e.button!==0)return;
 dragIndex=index;dragPointerId=e.pointerId;
 const el=e.currentTarget;
 el.setPointerCapture?.(e.pointerId);
 let moved=false;
 const move=ev=>{
   if(ev.pointerId!==dragPointerId)return;
   moved=true;
   const rect=document.getElementById('pitch').getBoundingClientRect();
   const x=((ev.clientX-rect.left)/rect.width)*100;
   const y=((ev.clientY-rect.top)/rect.height)*100;
   formationSlots[index].x=Math.max(5,Math.min(95,x));
   formationSlots[index].y=Math.max(5,Math.min(95,y));
   el.style.left=formationSlots[index].x+'%';el.style.top=formationSlots[index].y+'%';
   el.classList.add('dragging');
   const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.position');
   document.querySelectorAll('.position.drop-target').forEach(x=>x.classList.remove('drop-target'));
   if(target && target!==el)target.classList.add('drop-target');
 };
 const end=ev=>{
   if(ev.pointerId!==dragPointerId)return;
   document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',end);document.removeEventListener('pointercancel',end);
   el.classList.remove('dragging');
   document.querySelectorAll('.position.drop-target').forEach(x=>x.classList.remove('drop-target'));
   const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.position');
   if(moved)suppressNextClick=true;
   if(target && target!==el){
     const targetIndex=Number(target.dataset.index);
     const a=formationSlots[index],b=formationSlots[targetIndex];
     const ax=a.x,ay=a.y; a.x=b.x;a.y=b.y; b.x=ax;b.y=ay;
     const ap=a.player,bp=b.player; a.player=bp;b.player=ap;
     renderFormation();
   }else if(moved){
     renderFormation();
   }
   dragIndex=null;dragPointerId=null;
 };
 document.addEventListener('pointermove',move);document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
}

function openPlayerModal(index,isSub){
 const used=formationSlots.map(s=>s.player).filter(Boolean);
 const current=isSub?subSlots[index]:formationSlots[index].player;
 const modal=document.getElementById('modalBack'), list=document.getElementById('modalPlayers');
 const usedSubs=subSlots.filter(Boolean);
 document.getElementById('modalTitle').textContent=isSub?'交代予定の選手を選択':'この位置の選手を選択';
 list.innerHTML='';
 db.players.filter(p=>p===current || (!used.includes(p) && (!isSub || !usedSubs.includes(p)))).forEach(p=>{
   const b=document.createElement('button');b.textContent=p;
   b.onclick=()=>{
     if(isSub && !current && !usedSubs.includes(p) && usedSubs.length>=4){alert('交代予定は4人まで設定できます。');return;}
     if(isSub)subSlots[index]=p;else formationSlots[index].player=p;
     modal.classList.remove('show');renderFormation();
   };list.appendChild(b);
 });
 const clear=document.createElement('button');clear.textContent='空ける';clear.onclick=()=>{if(isSub)subSlots[index]=null;else formationSlots[index].player='';modal.classList.remove('show');renderFormation()};list.appendChild(clear);
 modal.classList.add('show');
}
document.getElementById('modalClose').onclick=()=>document.getElementById('modalBack').classList.remove('show');

document.getElementById('formationCount').onchange=resetFormation;
document.getElementById('formationPreset').onchange=()=>{formationSlots=presetData(selectedCount,document.getElementById('formationPreset').value);renderFormation()};
document.getElementById('clearFormation').onclick=resetFormation;
document.getElementById('saveFormation').onclick=()=>{
 const saved={id:Date.now(),savedAt:Date.now(),count:selectedCount,preset:document.getElementById('formationPreset').value,slots:JSON.parse(JSON.stringify(formationSlots)),subs:[...subSlots]};
 db.currentFormation=saved;
 db.savedFormations=[saved,...db.savedFormations.filter(x=>x.id!==saved.id)].slice(0,5);
 save();renderSavedFormations();alert('現在の配置を保存しました。');
};
function renderSavedFormations(){
 const el=document.getElementById('savedFormationList');
 if(!el)return;
 if(!db.savedFormations.length){el.innerHTML='<div class="empty">保存したフォーメーションはありません。</div>';return}
 el.innerHTML=db.savedFormations.slice(0,5).map((f,i)=>{
   const names=(f.slots||[]).filter(s=>s.player).map(s=>s.player).slice(0,4).join('、');
   const more=(f.slots||[]).filter(s=>s.player).length>4?'…':'';
   return `<button onclick="loadSavedFormation(${f.id})"><strong>${esc(f.preset||'自由配置')}・${f.count}人制</strong><span>${esc(names||'選手未配置')}${more}</span></button>`;
 }).join('');
}
window.loadSavedFormation=id=>{
 const f=db.savedFormations.find(x=>x.id===id);if(!f)return;
 selectedCount=Number(f.count)||6;
 document.getElementById('formationCount').value=selectedCount;
 fillFormationPresets(selectedCount);
 document.getElementById('formationPreset').value=f.preset||'自由配置';
 formationSlots=JSON.parse(JSON.stringify(f.slots||[]));
 subSlots=Array(selectedCount).fill(null);(f.subs||[]).forEach((v,i)=>{if(i<subSlots.length)subSlots[i]=v||null});
 renderFormation();
};

function renderScorers(){
 const el=document.getElementById('scorers'); const old=[...el.querySelectorAll('select')].map(x=>x.value).filter(Boolean);
 el.innerHTML='';
 old.forEach(p=>addScorerRow(p));
 if(!old.length) updateOurScore();
}
function addScorerRow(value=''){
 const row=document.createElement('div');row.className='scorer-row';
 const sel=document.createElement('select');sel.innerHTML=playerOptions(true);sel.value=value;
 const del=document.createElement('button');del.className='danger';del.textContent='削除';
 sel.onchange=updateOurScore;del.onclick=()=>{row.remove();updateOurScore()};
 row.append(sel,del);document.getElementById('scorers').appendChild(row);updateOurScore();
}
function updateOurScore(){document.getElementById('ourScore').value=[...document.querySelectorAll('#scorers select')].filter(x=>x.value).length}
document.getElementById('addScorer').onclick=()=>addScorerRow('');

document.getElementById('saveMatch').onclick=()=>{
 const tournament=getField('tournamentSelect','tournamentInput'),opponent=getField('opponentSelect','opponentInput'),venue=getField('venueSelect','venueInput');
 const match={
 id:Date.now(),tournament,opponent,venue,date:document.getElementById('matchDate').value,
 count:Number(document.getElementById('playerCount').value),formation:document.getElementById('formationSelect').value,
 ourScore:Number(document.getElementById('ourScore').value),oppScore:Number(document.getElementById('oppScore').value),
 scorers:[...document.querySelectorAll('#scorers select')].map(x=>x.value).filter(Boolean),
 memo:document.getElementById('matchMemo').value,
 slots:JSON.parse(JSON.stringify(formationSlots)),subs:[...subSlots]
 };
 db.matches.unshift(match);save();fillHistorySelects();renderHistory();switchTab('history');alert('試合を保存しました。履歴に追加しました。');
};

function fillMatchFormation(){
 const count=Number(document.getElementById('playerCount').value), sel=document.getElementById('formationSelect');
 const names=(PRESETS[count]||[]).map(x=>x[0]);sel.innerHTML=[...names,'自由配置'].map(x=>`<option>${x}</option>`).join('');
}
document.getElementById('playerCount').onchange=()=>{fillMatchFormation();selectedCount=Number(document.getElementById('playerCount').value);resetFormation()};

function formationText(m){
 const starters=m.slots.filter(s=>s.player).map((s,i)=>`${i+1}. ${s.player}（${s.role}）`).join('\n')||'なし';
 const subs=(m.subs||[]).filter(Boolean).join('、')||'なし';
 return `${m.tournament||'大会名なし'} / ${m.date||''}\n${m.opponent||'相手なし'} ${m.ourScore}-${m.oppScore}\nフォーメーション：${m.formation}\n先発：\n${starters}\n交代予定：${subs}`;
}
async function shareFormation(m){
 const text=formationText(m);
 if(navigator.share){try{await navigator.share({title:'フォーメーション',text})}catch(e){}}
 else if(navigator.clipboard){await navigator.clipboard.writeText(text);alert('フォーメーションをコピーしました。')}
 else alert(text);
}
function renderHistory(){
 const el=document.getElementById('historyList');
 if(!db.matches.length){el.innerHTML='<div class="empty">まだ試合履歴がありません。</div>';return}
 el.innerHTML=db.matches.map(m=>`
 <div class="history-item">
  <div class="history-meta">${esc(m.date)}　${esc(m.tournament||'')}</div>
  <h3 style="margin:5px 0">${esc(m.opponent||'対戦相手未入力')}　<strong>${m.ourScore}－${m.oppScore}</strong></h3>
  <div>${esc(m.venue||'会場未入力')} / ${m.count}人制 / ${esc(m.formation)}</div>
  <div>得点者：${m.scorers.length?m.scorers.map(esc).join('、'):'なし'}</div>
  <details><summary>フォーメーション配置を見る</summary>
   <div style="margin-top:10px">先発：${m.slots.filter(s=>s.player).map(s=>esc(s.player)).join('、')||'なし'}<br>交代予定：${(m.subs||[]).filter(Boolean).map(esc).join('、')||'なし'}</div>
  </details>
  <div class="actions">
   <button class="small" onclick="reuseFormation(${m.id})">この配置を使う</button>
   <button class="small" onclick="shareFormationById(${m.id})">配置を書き出す</button>
   <button class="small danger" onclick="deleteMatch(${m.id})">削除</button>
  </div>
  ${m.memo?`<div style="margin-top:8px;color:#6b7280">${esc(m.memo)}</div>`:''}
 </div>`).join('');
}
window.reuseFormation=id=>{
 const m=db.matches.find(x=>x.id===id);if(!m)return;
 selectedCount=m.count;document.getElementById('formationCount').value=m.count;fillFormationPresets(m.count);
 document.getElementById('formationPreset').value=m.formation;formationSlots=JSON.parse(JSON.stringify(m.slots||[]));subSlots=Array(selectedCount).fill(null);(m.subs||[]).forEach((v,i)=>{if(i<subSlots.length)subSlots[i]=v||null});
 renderFormation();switchTab('formation');
};
window.shareFormationById=id=>{const m=db.matches.find(x=>x.id===id);if(m)shareFormation(m)};
window.deleteMatch=id=>{if(confirm('この履歴を削除しますか？')){db.matches=db.matches.filter(x=>x.id!==id);save();fillHistorySelects();renderHistory()}};

function switchTab(id){
 document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.id===id));
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));
 if(id==='history')renderHistory();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

document.getElementById('exportData').onclick=()=>{
 const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='soccer-manager-backup.json';a.click();
};
document.getElementById('importData').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{
 const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{db=JSON.parse(r.result);save();renderPlayers();renderScorers();fillHistorySelects();renderHistory();alert('読み込みました。')}catch(err){alert('読み込みに失敗しました。')}};r.readAsText(f)
};
document.getElementById('deleteData').onclick=()=>{if(confirm('選手・履歴など全データを削除します。よろしいですか？')){localStorage.removeItem(KEY);location.reload()}};

document.getElementById('tournamentInput').style.display='none';
document.getElementById('opponentInput').style.display='none';
document.getElementById('venueNewWrap').style.display='none';

fillHistorySelects();renderPlayers();fillMatchFormation();renderSavedFormations();
document.getElementById('formationCount').value=6;resetFormation();renderScorers();renderHistory();
</script>
</body>
</html>
