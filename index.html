<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>⚽ サッカー試合管理</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  background:#f3f4f6;
  color:#111827;
}
header{
  background:#111827;
  color:white;
  padding:18px 16px;
  padding-top:calc(18px + env(safe-area-inset-top));
  position:sticky;
  top:0;
  z-index:100;
}
header h1{margin:0;font-size:21px}
nav{
  display:flex;
  background:white;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:64px;
  z-index:90;
}
nav button{
  flex:1;
  border:0;
  background:white;
  padding:13px 3px;
  font-size:12px;
}
nav button.active{
  color:#2563eb;
  font-weight:bold;
  border-bottom:3px solid #2563eb;
}
main{padding:14px;max-width:700px;margin:auto}
section{display:none}
section.active{display:block}
.card{
  background:white;
  border-radius:14px;
  padding:15px;
  margin-bottom:14px;
  box-shadow:0 1px 4px #0001;
}
h2{font-size:18px;margin:0 0 14px}
h3{font-size:15px;margin:15px 0 8px}
label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin:10px 0 5px;
}
input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid #d1d5db;
  border-radius:9px;
  font-size:16px;
  background:white;
}
textarea{min-height:90px;resize:vertical}
button{
  border:0;
  border-radius:9px;
  padding:11px 14px;
  font-size:15px;
  font-weight:bold;
}
.primary{background:#2563eb;color:white}
.green{background:#16a34a;color:white}
.red{background:#dc2626;color:white}
.gray{background:#e5e7eb;color:#111827}
.small{font-size:12px;padding:7px 9px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.player-list{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}
.player-chip{
  background:#e5e7eb;
  border-radius:20px;
  padding:8px 11px;
  font-size:14px;
}
.player-chip button{
  padding:0 0 0 7px;
  background:none;
  font-size:13px;
}
.match{
  border:1px solid #ddd;
  border-radius:12px;
  padding:13px;
  margin-bottom:10px;
}
.match-title{
  display:flex;
  justify-content:space-between;
  font-weight:bold;
}
.result-win{color:#16a34a}
.result-loss{color:#dc2626}
.result-draw{color:#6b7280}

/* ピッチ */
.pitch-wrap{
  background:#dbeafe;
  padding:8px;
  border-radius:14px;
}
.pitch{
  position:relative;
  width:100%;
  aspect-ratio:0.68;
  max-height:650px;
  background:#55a63a;
  border:3px solid white;
  border-radius:6px;
  overflow:hidden;
}
.pitch:before{
  content:"";
  position:absolute;
  left:0;right:0;
  top:50%;
  border-top:2px solid white;
}
.pitch:after{
  content:"";
  position:absolute;
  width:32%;
  aspect-ratio:1;
  border:2px solid white;
  border-radius:50%;
  left:34%;
  top:calc(50% - 16%);
}
.goalbox{
  position:absolute;
  left:25%;
  width:50%;
  height:12%;
  border:2px solid white;
}
.goal-top{top:0;border-top:0}
.goal-bottom{bottom:0;border-bottom:0}

.piece{
  position:absolute;
  transform:translate(-50%,-50%);
  width:54px;
  height:54px;
  border-radius:50%;
  background:white;
  border:3px solid #1d4ed8;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-size:10px;
  font-weight:bold;
  text-align:center;
  touch-action:none;
  user-select:none;
  box-shadow:0 2px 5px #0005;
}
.piece.empty{
  background:#ffffff99;
  border-style:dashed;
  color:#555;
}
.piece .num{font-size:16px}
.formation-help{
  font-size:12px;
  color:#555;
  margin-top:8px;
}
.selected{
  outline:4px solid #facc15;
}

.sub-list{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:8px;
}
.sub{
  background:#f3f4f6;
  padding:7px 10px;
  border-radius:8px;
  font-size:13px;
}
.empty-state{
  text-align:center;
  color:#777;
  padding:25px 5px;
}
.danger-zone{
  border:1px solid #fecaca;
  background:#fef2f2;
}
</style>
</head>

<body>

<header>
  <h1>⚽ サッカー試合管理</h1>
</header>

<nav>
  <button class="active" onclick="showTab('home',this)">ホーム</button>
  <button onclick="showTab('players',this)">選手</button>
  <button onclick="showTab('formation',this)">配置</button>
  <button onclick="showTab('history',this)">履歴</button>
  <button onclick="showTab('settings',this)">設定</button>
</nav>

<main>

<!-- ホーム -->
<section id="home" class="active">

<div class="card">
<h2>新しい試合</h2>

<label>大会名</label>
<input id="tournament" placeholder="例：○○大会">

<label>対戦相手</label>
<input id="opponent" placeholder="例：○○FC">

<div class="grid2">
<div>
<label>日付</label>
<input id="matchDate" type="date">
</div>
<div>
<label>会場</label>
<input id="venue" placeholder="例：○○小学校">
</div>
</div>

<div class="grid2">
<div>
<label>人数</label>
<select id="playersCount" onchange="changeCount()">
<option value="5">5人制</option>
<option value="6">6人制</option>
<option value="7" selected>7人制</option>
<option value="8">8人制</option>
<option value="9">9人制</option>
<option value="10">10人制</option>
<option value="11">11人制</option>
</select>
</div>

<div>
<label>フォーメーション</label>
<select id="formationType" onchange="changeFormation()">
<option value="custom">自由配置</option>
<option value="1-2-3-1">1-2-3-1</option>
<option value="1-3-2-1">1-3-2-1</option>
<option value="1-2-2-2">1-2-2-2</option>
<option value="1-3-3">1-3-3</option>
<option value="1-2-3-2">1-2-3-2</option>
<option value="1-4-3-3">1-4-3-3</option>
<option value="1-4-4-2">1-4-4-2</option>
</select>
</div>
</div>

<h3>スコア</h3>
<div class="row">
<input id="myScore" type="number" min="0" value="0">
<span style="text-align:center;font-size:20px">－</span>
<input id="opponentScore" type="number" min="0" value="0">
</div>

<h3>得点者</h3>
<div id="scorerList"></div>
<button class="gray small" onclick="addScorer()">＋ 得点者を追加</button>

<label>試合メモ</label>
<textarea id="memo" placeholder="試合内容、課題、良かった点など"></textarea>

<br><br>
<button class="primary" style="width:100%" onclick="saveMatch()">試合を保存する</button>
</div>

<div class="card">
<h2>現在のフォーメーション</h2>
<div class="pitch-wrap">
<div class="pitch" id="homePitch"></div>
</div>
<p class="formation-help">
「配置」タブで選手を配置できます。選手は指でドラッグして移動できます。
</p>
</div>

</section>


<!-- 選手 -->
<section id="players">

<div class="card">
<h2>選手登録</h2>

<div class="row">
<input id="newPlayer" placeholder="選手名">
<button class="primary" onclick="addPlayer()">追加</button>
</div>

<div id="playerList" class="player-list" style="margin-top:15px"></div>
</div>

</section>


<!-- フォーメーション -->
<section id="formation">

<div class="card">

<h2>フォーメーション</h2>

<div class="grid2">
<div>
<label>人数</label>
<select id="formationCount" onchange="setFormationCount()">
<option value="5">5人制</option>
<option value="6">6人制</option>
<option value="7" selected>7人制</option>
<option value="8">8人制</option>
<option value="9">9人制</option>
<option value="10">10人制</option>
<option value="11">11人制</option>
</select>
</div>

<div>
<label>配置</label>
<select id="formationSelect" onchange="changeFormation()">
<option value="custom">自由配置</option>
<option value="1-2-3-1">1-2-3-1</option>
<option value="1-3-2-1">1-3-2-1</option>
<option value="1-2-2-2">1-2-2-2</option>
<option value="1-3-3">1-3-3</option>
<option value="1-2-3-2">1-2-3-2</option>
<option value="1-4-3-3">1-4-3-3</option>
<option value="1-4-4-2">1-4-4-2</option>
</select>
</div>
</div>

<div class="pitch-wrap">
<div class="pitch" id="formationPitch"></div>
</div>

<p class="formation-help">
選手を長押しして、そのまま指で動かしてください。
</p>

<h3>ベンチ</h3>
<div id="bench" class="sub-list"></div>

</div>

</section>


<!-- 履歴 -->
<section id="history">

<div class="card">
<h2>試合履歴</h2>
<div id="historyList"></div>
</div>

</section>


<!-- 設定 -->
<section id="settings">

<div class="card">
<h2>データ管理</h2>

<p style="font-size:13px">
選手・試合・フォーメーションのデータは、このiPhoneのブラウザ内に保存されています。
</p>

<button class="primary" style="width:100%;margin-bottom:10px" onclick="backupData()">
データをバックアップ
</button>

<button class="gray" style="width:100%" onclick="document.getElementById('restoreFile').click()">
バックアップから復元
</button>

<input id="restoreFile" type="file" accept=".json" style="display:none" onchange="restoreData(event)">

</div>

<div class="card danger-zone">
<h2>データ削除</h2>
<p style="font-size:13px">
すべての選手・試合データを削除します。
</p>
<button class="red" onclick="deleteAll()">すべて削除</button>
</div>

</section>

</main>


<script>

let players = JSON.parse(localStorage.getItem("players") || "[]");
let matches = JSON.parse(localStorage.getItem("matches") || "[]");

let formation = JSON.parse(
  localStorage.getItem("formation") ||
  "null"
);

let selectedCount = 7;
let selectedFormation = "custom";

const defaultPositions = {
  5:[
    [50,92],[30,65],[70,65],[35,35],[65,35]
  ],
  6:[
    [50,92],[25,70],[75,70],[25,40],[75,40],[50,20]
  ],
  7:[
    [50,92],[25,72],[50,72],[75,72],[25,42],[75,42],[50,22]
  ],
  8:[
    [50,92],[20,72],[50,72],[80,72],[20,45],[50,45],[80,45],[50,20]
  ],
  9:[
    [50,92],[18,72],[40,72],[60,72],[82,72],[25,45],[50,45],[75,45],[50,20]
  ],
  10:[
    [50,92],[15,72],[38,72],[62,72],[85,72],[20,45],[50,45],[80,45],[35,20],[65,20]
  ],
  11:[
    [50,92],[15,72],[38,72],[62,72],[85,72],[15,45],[38,45],[62,45],[85,45],[35,20],[65,20]
  ]
};

function saveData(){
  localStorage.setItem("players",JSON.stringify(players));
  localStorage.setItem("matches",JSON.stringify(matches));
  localStorage.setItem("formation",JSON.stringify(formation));
}

function showTab(id,btn){

  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  if(id==="players") renderPlayers();
  if(id==="formation") renderFormation();
  if(id==="history") renderHistory();
  if(id==="home") renderHomePitch();
}

function addPlayer(){

  const input=document.getElementById("newPlayer");
  const name=input.value.trim();

  if(!name)return;

  players.push({
    id:Date.now(),
    name:name
  });

  input.value="";
  saveData();
  renderPlayers();
}

function renderPlayers(){

  const box=document.getElementById("playerList");

  if(players.length===0){
    box.innerHTML='<div class="empty-state">まだ選手が登録されていません。</div>';
    return;
  }

  box.innerHTML=players.map(p=>`
    <div class="player-chip">
      ${escapeHtml(p.name)}
      <button onclick="removePlayer(${p.id})">×</button>
    </div>
  `).join("");
}

function removePlayer(id){

  if(!confirm("この選手を削除しますか？"))return;

  players=players.filter(p=>p.id!==id);
  saveData();
  renderPlayers();
  renderFormation();
}

function changeCount(){

  selectedCount=Number(document.getElementById("playersCount").value);

  document.getElementById("formationCount").value=selectedCount;

  resetFormation();
  renderHomePitch();
  renderFormation();
}

function setFormationCount(){

  selectedCount=Number(document.getElementById("formationCount").value);
  document.getElementById("playersCount").value=selectedCount;

  resetFormation();
  renderFormation();
}

function resetFormation(){

  const pos=defaultPositions[selectedCount];

  formation=pos.map((p,i)=>({
    x:p[0],
    y:p[1],
    playerId:null,
    number:i+1
  }));

  selectedFormation="custom";

  document.getElementById("formationType").value="custom";
  document.getElementById("formationSelect").value="custom";

  saveData();
}

function changeFormation(){

  const select=document.getElementById("formationSelect");
  const homeSelect=document.getElementById("formationType");

  selectedFormation=
    document.activeElement===select
    ? select.value
    : homeSelect.value;

  document.getElementById("formationSelect").value=selectedFormation;
  document.getElementById("formationType").value=selectedFormation;

  if(selectedFormation==="custom"){
    renderFormation();
    renderHomePitch();
    return;
  }

  const nums=selectedFormation.split("-").map(Number);
  const total=nums.reduce((a,b)=>a+b,0);

  if(total!==selectedCount-1){
    alert("このフォーメーションは現在の人数と合いません。");
    return;
  }

  let positions=[
    [50,92]
  ];

  const rows=nums.slice(1);
  const ys=[];

  rows.forEach((n,i)=>{
    ys.push(72-(i*25));
  });

  rows.forEach((n,i)=>{
    for(let j=0;j<n;j++){
      positions.push([
        n===1?50:20+(60*j/(n-1)),
        ys[i]
      ]);
    }
  });

  formation=positions.map((p,i)=>({
    x:p[0],
    y:p[1],
    playerId:null,
    number:i+1
  }));

  selectedFormation=selectedFormation;

  saveData();
  renderFormation();
  renderHomePitch();
}

function renderFormation(){

  if(!formation || formation.length!==selectedCount){
    resetFormation();
  }

  const pitch=document.getElementById("formationPitch");
  pitch.innerHTML=`
    <div class="goalbox goal-top"></div>
    <div class="goalbox goal-bottom"></div>
  `;

  formation.forEach((slot,i)=>{

    const p=document.createElement("div");

    p.className="piece"+(slot.playerId?"":" empty");

    p.style.left=slot.x+"%";
    p.style.top=slot.y+"%";

    const player=players.find(x=>x.id===slot.playerId);

    p.innerHTML=`
      <div class="num">${i===0?"GK":i+1}</div>
      <div>${player?escapeHtml(player.name):"空き"}</div>
    `;

    makeDraggable(p,slot);

    p.onclick=(e)=>{
      e.stopPropagation();
      choosePlayer(slot);
    };

    pitch.appendChild(p);
  });

  renderBench();
}

function choosePlayer(slot){

  if(players.length===0){
    alert("先に「選手」タブから選手を登録してください。");
    return;
  }

  let html='<option value="">空き</option>';

  players.forEach(p=>{
    const used=formation.some(s=>s!==slot && s.playerId===p.id);

    html+=`
      <option value="${p.id}" ${slot.playerId===p.id?"selected":""} ${used?"disabled":""}>
        ${escapeHtml(p.name)}
      </option>
    `;
  });

  const div=document.createElement("div");

  div.innerHTML=`
    <select>${html}</select>
  `;

  const select=div.firstElementChild;

  if(confirm("この位置の選手を選択します。\nOKを押して選択してください。")){
    const value=select.value;

    if(value===""){
      slot.playerId=null;
    }else{
      slot.playerId=Number(value);
    }

    saveData();
    renderFormation();
    renderHomePitch();
  }
}

function renderBench(){

  const box=document.getElementById("bench");

  const used=formation.map(s=>s.playerId).filter(Boolean);

  const bench=players.filter(p=>!used.includes(p.id));

  if(!bench.length){
    box.innerHTML='<span style="font-size:13px;color:#777">控え選手なし</span>';
    return;
  }

  box.innerHTML=bench.map(p=>`
    <span class="sub">${escapeHtml(p.name)}</span>
  `).join("");
}

function makeDraggable(el,slot){

  let dragging=false;

  function move(e){

    if(!dragging)return;

    const rect=el.parentElement.getBoundingClientRect();

    const point=e.touches?e.touches[0]:e;

    let x=(point.clientX-rect.left)/rect.width*100;
    let y=(point.clientY-rect.top)/rect.height*100;

    x=Math.max(4,Math.min(96,x));
    y=Math.max(5,Math.min(95,y));

    slot.x=x;
    slot.y=y;

    el.style.left=x+"%";
    el.style.top=y+"%";
  }

  function end(){

    if(dragging){
      dragging=false;
      saveData();
    }
  }

  el.addEventListener("touchstart",()=>{
    dragging=true;
  },{passive:true});

  el.addEventListener("touchmove",move,{passive:true});
  el.addEventListener("touchend",end);

  el.addEventListener("mousedown",()=>{
    dragging=true;
  });

  document.addEventListener("mousemove",move);
  document.addEventListener("mouseup",end);
}

function renderHomePitch(){

  const pitch=document.getElementById("homePitch");

  if(!pitch)return;

  pitch.innerHTML=`
    <div class="goalbox goal-top"></div>
    <div class="goalbox goal-bottom"></div>
  `;

  if(!formation)return;

  formation.forEach((slot,i)=>{

    const p=document.createElement("div");

    p.className="piece"+(slot.playerId?"":" empty");

    p.style.left=slot.x+"%";
    p.style.top=slot.y+"%";

    const player=players.find(x=>x.id===slot.playerId);

    p.innerHTML=`
      <div class="num">${i===0?"GK":i+1}</div>
      <div>${player?escapeHtml(player.name):"空き"}</div>
    `;

    pitch.appendChild(p);
  });
}

function addScorer(){

  const box=document.getElementById("scorerList");

  const div=document.createElement("div");
  div.className="row";
  div.style.marginBottom="7px";

  let options='<option value="">選手を選択</option>';

  players.forEach(p=>{
    options+=`<option>${escapeHtml(p.name)}</option>`;
  });

  div.innerHTML=`
    <select>${options}</select>
    <button class="red small" onclick="this.parentElement.remove()">削除</button>
  `;

  box.appendChild(div);
}

function saveMatch(){

  const tournament=document.getElementById("tournament").value.trim();
  const opponent=document.getElementById("opponent").value.trim();
  const date=document.getElementById("matchDate").value;
  const venue=document.getElementById("venue").value.trim();
  const myScore=Number(document.getElementById("myScore").value||0);
  const opponentScore=Number(document.getElementById("opponentScore").value||0);
  const memo=document.getElementById("memo").value.trim();

  if(!opponent){
    alert("対戦相手を入力してください。");
    return;
  }

  let result="draw";

  if(myScore>opponentScore)result="win";
  if(myScore<opponentScore)result="loss";

  const scorers=[
    ...document.querySelectorAll("#scorerList select")
  ].map(s=>s.value).filter(Boolean);

  matches.unshift({
    id:Date.now(),
    tournament,
    opponent,
    date,
    venue,
    count:selectedCount,
    formation:selectedFormation,
    score:myScore+" - "+opponentScore,
    result,
    scorers,
    memo,
    lineup:JSON.parse(JSON.stringify(formation))
  });

  saveData();

  alert("試合を保存しました！");

  document.getElementById("tournament").value="";
  document.getElementById("opponent").value="";
  document.getElementById("venue").value="";
  document.getElementById("myScore").value=0;
  document.getElementById("opponentScore").value=0;
  document.getElementById("memo").value="";
  document.getElementById("scorerList").innerHTML="";

  showTab(
    "history",
    document.querySelectorAll("nav button")[3]
  );
}

function renderHistory(){

  const box=document.getElementById("historyList");

  if(!matches.length){
    box.innerHTML='<div class="empty-state">まだ試合記録がありません。</div>';
    return;
  }

  box.innerHTML=matches.map(m=>{

    const resultText=
      m.result==="win"?"勝利":
      m.result==="loss"?"敗戦":"引き分け";

    const resultClass=
      m.result==="win"?"result-win":
      m.result==="loss"?"result-loss":"result-draw";

    return `
      <div class="match">
        <div class="match-title">
          <span>${escapeHtml(m.opponent)}</span>
          <span class="${resultClass}">${resultText}</span>
        </div>

        <div style="font-size:24px;font-weight:bold;margin:8px 0">
          ${escapeHtml(m.score)}
        </div>

        <div style="font-size:13px;color:#666">
          ${escapeHtml(m.date||"日付なし")}
          ${m.tournament?"｜"+escapeHtml(m.tournament):""}
        </div>

        <div style="font-size:13px;margin-top:6px">
          ${m.count}人制 ／ ${escapeHtml(m.formation)}
        </div>

        ${
          m.scorers.length
          ? `<div style="font-size:13px;margin-top:6px">
              ⚽ ${m.scorers.map(escapeHtml).join("、")}
             </div>`
          :""
        }

        ${
          m.memo
          ? `<div style="font-size:13px;margin-top:8px">
              ${escapeHtml(m.memo)}
             </div>`
          :""
        }

        <button class="red small" style="margin-top:10px"
          onclick="deleteMatch(${m.id})">
          削除
        </button>
      </div>
    `;

  }).join("");
}

function deleteMatch(id){

  if(!confirm("この試合記録を削除しますか？"))return;

  matches=matches.filter(m=>m.id!==id);

  saveData();
  renderHistory();
}

function backupData(){

  const data={
    players,
    matches,
    formation
  };

  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download="soccer-manager-backup.json";

  a.click();

  URL.revokeObjectURL(url);
}

function restoreData(event){

  const file=event.target.files[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=function(e){

    try{

      const data=JSON.parse(e.target.result);

      if(!data.players || !data.matches){
        throw new Error();
      }

      players=data.players;
      matches=data.matches;
      formation=data.formation;

      saveData();

      alert("データを復元しました。");

      renderPlayers();
      renderFormation();
      renderHistory();
      renderHomePitch();

    }catch{
      alert("バックアップデータを読み込めませんでした。");
    }

  };

  reader.readAsText(file);
}

function deleteAll(){

  if(!confirm("本当にすべて削除しますか？"))return;

  if(!confirm("この操作は元に戻せません。本当に削除しますか？"))return;

  players=[];
  matches=[];
  formation=null;

  localStorage.clear();

  resetFormation();

  renderPlayers();
  renderFormation();
  renderHistory();
  renderHomePitch();

  alert("すべて削除しました。");
}

function escapeHtml(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


// 初期化
if(!formation || formation.length!==selectedCount){
  resetFormation();
}

document.getElementById("matchDate").value=
  new Date().toISOString().slice(0,10);

renderPlayers();
renderFormation();
renderHomePitch();

</script>
