<style>
*{box-sizing:border-box}html,body{margin:0;background:#090d12;color:#e8edf2;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}body{min-height:100vh}button,input,select,textarea{font:inherit;-webkit-text-size-adjust:100%}button{border:0;cursor:pointer}.app-header{padding:18px 16px 12px;background:linear-gradient(180deg,#111820,#0b1016);font-size:21px;font-weight:900;letter-spacing:.04em}.nav{position:sticky;top:0;z-index:30;display:flex;overflow:hidden;background:#0d131a;border-bottom:1px solid #26313b}.nav button{flex:0 0 33.333%;background:transparent;color:#82909d;padding:10px 5px;font-size:12px;font-weight:800;border-bottom:2px solid transparent}.nav button.active{color:#fff;border-bottom-color:#b8d36a}.viewport{overflow:hidden}.pages{display:flex;width:300%;transition:transform .28s ease;touch-action:pan-y}.page{width:33.333333%;min-width:33.333333%;padding:8px;min-height:calc(100vh - 95px)}.card{background:#121920;border:1px solid #26323c;border-radius:13px;padding:10px;margin-bottom:8px;box-shadow:0 8px 25px #0005}.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 7px;font-size:15px}.muted{color:#7f8b96;font-size:11px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.field label{display:block;color:#9ba7b2;font-size:10px;font-weight:800;margin:0 0 3px}.input,select,textarea{width:100%;border:1px solid #303d48;border-radius:7px;background:#0d141b;color:#e9eef2;padding:6px 7px;font-size:15px;outline:none}.input:focus,select:focus,textarea:focus{border-color:#91ad52}textarea{min-height:45px;resize:vertical}.scoreline{display:grid;grid-template-columns:1fr 18px 1fr;gap:5px;align-items:center;margin-top:5px}.scoreline input{text-align:center;font-size:19px;font-weight:900}.scoreline span{text-align:center;color:#77838d}.btn{background:#26313a;color:#dfe7ed;border:1px solid #34424d;border-radius:7px;padding:7px 9px;font-size:11px;font-weight:800}.btn.primary{background:#a8c45d;color:#10150c;border-color:#a8c45d}.btn.danger{background:#3a2024;color:#ffb6bd;border-color:#5c2d33}.actions{display:flex;gap:5px;flex-wrap:wrap}.scorers-wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;overflow:hidden}.scorer-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px;margin:0;min-width:0}.scorer-row select{min-width:0}.scorer-row .btn{padding:4px 5px;font-size:12px}.scorer-row .btn{padding:5px 7px}.pitch-card{display:grid;grid-template-columns:minmax(0,1fr) 105px;gap:8px;align-items:start}.pitch{touch-action:none;position:relative;width:100%;max-width:380px;margin:auto;aspect-ratio:.68;background:linear-gradient(90deg,#27462a,#315b34 50%,#27462a);border:4px solid #52605a;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 30px #0005}.line{position:absolute;border:1px solid #e9f0e5cc;pointer-events:none;z-index:1}.center-line{left:0;right:0;top:50%;border-top:1px solid #e9f0e5cc}.center-circle{left:50%;top:50%;width:23%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}.pa{left:26%;width:48%;height:19%}.pa.top{top:0;border-top:0}.pa.bottom{bottom:0;border-bottom:0}.ga{left:40%;width:20%;height:8%}.ga.top{top:0;border-top:0}.ga.bottom{bottom:0;border-bottom:0}.spot{left:50%;width:4px;height:4px;border:0;background:#fff;border-radius:50%;transform:translateX(-50%)}.spot.top{top:13%}.spot.bottom{bottom:13%}.position{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:#eef3e8;color:#142015;border:2px solid #b8d36a;z-index:4;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9px;font-weight:900;line-height:1.05;user-select:none;touch-action:none;box-shadow:0 2px 5px #0007}.position.empty{background:#16201a;color:#a7b4a4;border-style:dashed}.position.dragging{opacity:.35}.position.drop{box-shadow:0 0 0 3px #fff}.sub-marker{touch-action:none;position:absolute;transform:translate(-50%,0);z-index:20;max-width:62px;min-width:46px;min-height:24px;padding:4px 6px;border:1px dashed #dce7d5a0;background:#ffffff12;color:#e6eee0aa;border-radius:4px;font-size:7px;line-height:1.1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:auto}.sub-marker.drop{box-shadow:0 0 0 3px #fff;background:#ffffff2b!important;color:#fff}.sub-marker.filled{background:#dce8c755;color:#eef5e9;border-color:#dce8c7bb}.pool{min-width:0}.pool-title{font-size:10px;color:#8e9aa4;margin-bottom:5px;font-weight:900}.pool-list{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}.pool-player{padding:6px 5px;border:1px solid #3a4852;border-radius:6px;background:#1a242d;color:#e7edf1;font-size:10px;font-weight:800;touch-action:none;user-select:none}.pool-player.used{opacity:.25}.pool-player.dragging{opacity:.35}.sub-list{display:none}.formation-tools{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}.saved5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:5px}.saved5 button{height:29px;padding:0;background:#1b252d;color:#9daaaf;border:1px solid #35434e;border-radius:6px;font-size:11px;font-weight:900}.saved5 button.active{background:#303e29;color:#d8e9a9;border-color:#8fa74f}.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.calendar-head button{width:34px;height:30px;padding:0;background:#202b34;color:#fff;border-radius:7px}.month-label{font-size:15px;font-weight:900}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.dow{text-align:center;color:#687680;font-size:9px;padding:3px}.day{min-height:46px;background:#10171d;border:1px solid #202b34;border-radius:6px;padding:3px;position:relative}.day.muted-day{opacity:.25}.day-num{font-size:9px;color:#9ca8b0}.day.has-match{border-color:#718b45;background:#182119}.dot{display:block;margin-top:3px;border-radius:4px;background:#9fbd55;color:#10150c;font-size:8px;font-weight:900;padding:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.match-list{margin-top:8px}.match-item{border:1px solid #2a3741;background:#10171d;border-radius:9px;padding:7px;margin:5px 0}.match-top{display:flex;justify-content:space-between;gap:6px;font-size:11px;font-weight:900}.match-sub{color:#7f8c96;font-size:9px;margin-top:3px}.match-formation{margin-top:5px;color:#b8c5ce;font-size:9px}.settings-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #26323b}.settings-item:last-child{border-bottom:0}.modal-back{position:fixed;inset:0;background:#000b;z-index:100;display:none;align-items:flex-end}.modal-back.show{display:flex}.modal{width:100%;max-height:72vh;background:#121a21;border-top:1px solid #3b4852;border-radius:16px 16px 0 0;padding:12px;overflow:auto}.modal h3{margin:0 0 8px;font-size:14px}.modal button{width:100%;text-align:left;margin:3px 0;background:#1c2730;color:#e8edf0;padding:9px;border-radius:7px}.modal .close{text-align:center;background:#303b44}.player-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #26323b;font-size:12px}.notice{padding:8px;background:#18231b;border:1px solid #35452c;border-radius:8px;color:#b9caa5;font-size:10px}.empty{text-align:center;color:#6f7b84;padding:15px;font-size:11px}.hidden{display:none!important}.page-sub{display:none}.back-btn{margin-bottom:7px}.calendar-detail{font-size:10px;color:#9aa6af}.calendar-detail strong{color:#e9eef2}
@media(max-width:500px){.pitch-card{grid-template-columns:minmax(0,1fr) 91px}.position{width:34px;height:34px;font-size:7px}.sub-marker{font-size:6px;max-width:42px;min-width:40px;min-height:22px}.page{padding:6px}.card{padding:8px}.app-header{padding:14px 12px 9px;font-size:19px}}

.coach-area{margin-top:7px;padding:7px;border:1px solid #25313a;border-radius:8px;background:#0d141b}
.coach-title{font-size:10px;font-weight:900;color:#9daab4;margin-bottom:5px}
.coach-list{display:flex;gap:5px;flex-wrap:wrap}
.coach-chip{padding:5px 8px;border:1px solid #3a4650;border-radius:999px;background:#151d25;color:#8f9aa4;font-size:10px;font-weight:800;touch-action:manipulation}
.coach-chip.present{border-color:#b8d36a;background:#27331e;color:#eaf5d8}
.drag-ghost{position:fixed;z-index:9999;pointer-events:none;padding:7px 10px;border:1px solid #b8d36a;border-radius:8px;background:#18221bd9;color:#fff;font-size:12px;font-weight:900;box-shadow:0 8px 20px #0008;transform:translate(-50%,-120%)}
.scorers-wrap .scorer-row{flex:1 1 0;min-width:0;margin:0}
.scorers-wrap .scorer-row select{min-width:0;width:100%}
.match-grid{display:grid;grid-template-columns:25% 45% 30%;gap:5px}.match-grid.row1{grid-template-columns:50% 50%}.match-grid.row2{grid-template-columns:30% 30% 40%;margin-top:5px}.opp-score-wrap{display:grid;grid-template-columns:28px 1fr 28px;gap:3px;align-items:center}.score-btn{height:34px;border:1px solid #34424d;border-radius:7px;background:#26313a;color:#e5edf2;font-weight:900;font-size:16px}.score-btn:active{background:#3a4852}</style>
</head>
<body>
<header class="app-header">⚽ Football Manager</header>
<nav class="nav" id="nav"><button class="active" data-page="0">試合</button><button data-page="1">カレンダー</button><button data-page="2">設定</button></nav>
<div class="viewport"><div class="pages" id="pages">
<section class="page" id="matchPage">
 <div class="card">
  <div class="section-title"><span>試合内容</span><span class="muted">保存時に配置も一緒に記録</span></div>
  <div class="match-grid row1">
   <div class="field"><label>日付</label><input class="input" id="matchDate" type="date"></div>
   <div class="field"><label>大会名</label><select id="tournamentSelect"></select><input class="input hidden" id="tournamentInput" placeholder="大会名"></div>
  </div>
  <div class="match-grid row2">
   <div class="field"><label>試合時間</label><select id="matchTime"><option>7分</option><option>7分ハーフ</option><option>10分</option><option>10分ハーフ</option><option>15分</option><option>15分ハーフ</option><option>20分</option><option>20分ハーフ</option></select></div>
   <div class="field"><label>対戦相手</label><select id="opponentSelect"></select><input class="input hidden" id="opponentInput" placeholder="対戦相手"></div>
   <div class="field"><label>会場</label><select id="venueSelect"></select><input class="input hidden" id="venueInput" placeholder="会場"></div>
  </div>
  <div class="scoreline"><input class="input" id="ourScore" type="number" min="0" value="0" readonly><span>－</span><div class="opp-score-wrap"><button type="button" class="score-btn" id="oppDown">−</button><input class="input" id="oppScore" type="number" min="0" value="0" readonly><button type="button" class="score-btn" id="oppUp">＋</button></div></div>
  <div class="muted" style="margin:5px 0 2px">得点者</div><div id="scorers" class="scorers-wrap"></div>
  <div class="actions"><button class="btn" id="addScorer">＋得点者</button></div>
  <textarea class="input" id="matchMemo" placeholder="試合メモ" style="margin-top:5px"></textarea>
 </div>
 <div class="card">
  <div class="section-title"><span>フォーメーション</span><span class="muted">選手を外からドラッグ</span></div>
  <div class="grid2">
   <div class="field"><label>人数</label><select id="formationCount"><option value="5">5人制</option><option value="6" selected>6人制</option><option value="7">7人制</option><option value="8">8人制</option><option value="9">9人制</option><option value="10">10人制</option><option value="11">11人制</option></select></div>
   <div class="field"><label>形</label><select id="formationPreset"></select></div>
  </div>
  <div class="pitch-card" style="margin-top:7px">
   <div class="pitch" id="pitch"></div>
   <div class="pool"><div class="pool-title">メンバー</div><div id="playerPool" class="pool-list"></div><div class="muted" style="margin-top:7px">タップ：配置<br>ドラッグ：配置</div></div>
  </div> 
  <div class="coach-area"><div class="coach-title">コーチ出欠（タップで切替）</div><div id="coachList" class="coach-list"></div></div>
  <div class="formation-tools"><button class="btn" id="clearFormation">配置をリセット</button><button class="btn" id="clearSubs">交代予定をクリア</button></div>
  <div class="muted" style="margin-top:5px">ポジションをタップして選手を選ぶこともできます。配置済み選手を別位置へドラッグすると入れ替え。</div>
  <div class="section-title" style="margin-top:8px"><span>直近5試合の保存フォーメーション</span><span class="muted">①〜⑤</span></div>
  <div id="saved5" class="saved5"></div>
  <button class="btn primary" id="saveMatch" style="width:100%;margin-top:7px">試合を保存</button>
 </div>
</section>
<section class="page" id="calendarPage">
 <div class="card">
  <div class="calendar-head"><button id="prevMonth">‹</button><div class="month-label" id="monthLabel"></div><button id="nextMonth">›</button></div>
  <div class="calendar" id="calendar"></div>
  <div class="match-list" id="dayMatches"><div class="empty">試合日をタップすると詳細が表示されます。</div></div>
 </div>
</section>
<section class="page" id="settingsPage">
 <div id="settingsHome" class="card">
  <div class="section-title"><span>設定</span></div>
  <div class="settings-item"><div><strong style="font-size:12px">選手登録</strong><div class="muted">メンバーの追加・削除</div></div><button class="btn primary" id="openPlayers">選手登録</button></div>
  <div class="settings-item"><div><strong style="font-size:12px">コーチ登録</strong><div class="muted">コーチの追加・削除</div></div><button class="btn primary" id="openCoaches">コーチ登録</button></div>
  <div class="settings-item"><div><strong style="font-size:12px">データ</strong><div class="muted">バックアップ・全削除</div></div><div class="actions"><button class="btn" id="exportData">書き出し</button><button class="btn" id="importData">読み込み</button><button class="btn danger" id="deleteData">全削除</button><input id="importFile" type="file" accept=".json" class="hidden"></div></div>
 </div>
 <div id="playerPage" class="card page-sub">
  <button class="btn back-btn" id="backSettings">← 設定に戻る</button>
  <div class="section-title"><span>選手登録</span><span class="muted">自動保存</span></div>
  <div class="actions"><input class="input" id="newPlayer" placeholder="選手名" style="flex:1"><button class="btn primary" id="addPlayer">追加</button></div>
  <div id="playerList" style="margin-top:7px"></div>
 </div>
 <div id="coachPage" class="card page-sub">
  <button class="btn back-btn" id="backCoaches">← 設定に戻る</button>
  <div class="section-title"><span>コーチ登録</span><span class="muted">自動保存</span></div>
  <div class="actions"><input class="input" id="newCoach" placeholder="コーチ名" style="flex:1"><button class="btn primary" id="addCoach">追加</button></div>
  <div id="coachRegList" style="margin-top:7px"></div>
 </div>
</section>
</div></div>
<div id="modalBack" class="modal-back"><div class="modal"><h3 id="modalTitle">選手を選択</h3><div id="modalPlayers"></div><button class="close" id="modalClose">キャンセル</button></div></div>
<script>
const KEY='soccerManagerV2';
function loadDB(){
 const raw=localStorage.getItem(KEY);if(raw){try{return JSON.parse(raw)}catch(e){}}
 const op=JSON.parse(localStorage.getItem('players')||'[]'),om=JSON.parse(localStorage.getItem('matches')||'[]'),of=JSON.parse(localStorage.getItem('formation')||'null');
 return {players:op.map(p=>typeof p==='string'?p:(p&&p.name||'')).filter(Boolean),coaches:[],matches:Array.isArray(om)?om:[],currentFormation:of,savedFormations:[]};
}
let db=loadDB();db.players=Array.isArray(db.players)?db.players:[];db.coaches=Array.isArray(db.coaches)?db.coaches:[];db.matches=Array.isArray(db.matches)?db.matches:[];db.savedFormations=Array.isArray(db.savedFormations)?db.savedFormations:[];db.coachAttendance=db.coachAttendance||{};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function unique(a){return [...new Set(a.filter(Boolean))]}
const PRESETS={
5:[['2-1-1',[['GK',50,88],['DF',32,64],['DF',68,64],['MF',50,43],['FW',50,16]]]],
6:[['1-3-1',[['GK',50,88],['DF',50,64],['MF',22,43],['MF',50,43],['MF',78,43],['FW',50,16]]],['2-2-1',[['GK',50,88],['DF',32,64],['DF',68,64],['MF',32,43],['MF',68,43],['FW',50,16]]]],
7:[['2-3-1',[['GK',50,88],['DF',30,64],['DF',70,64],['MF',20,43],['MF',50,43],['MF',80,43],['FW',50,16]]],['3-2-1',[['GK',50,88],['DF',20,64],['DF',50,64],['DF',80,64],['MF',35,43],['MF',65,43],['FW',50,16]]]],
8:[['3-3-1',[['GK',50,88],['DF',20,64],['DF',50,64],['DF',80,64],['MF',20,43],['MF',50,43],['MF',80,43],['FW',50,16]]]],
9:[['3-3-2',[['GK',50,88],['DF',20,64],['DF',50,64],['DF',80,64],['MF',20,43],['MF',50,43],['MF',80,43],['FW',38,16],['FW',62,16]]]],
10:[['3-4-2',[['GK',50,88],['DF',15,64],['DF',50,64],['DF',85,64],['MF',12,43],['MF',37,43],['MF',63,43],['MF',88,43],['FW',38,16],['FW',62,16]]]],
11:[['3-5-2',[['GK',50,88],['DF',20,64],['DF',50,64],['DF',80,64],['MF',12,43],['MF',34,43],['MF',50,43],['MF',66,43],['MF',88,43],['FW',38,16],['FW',62,16]]],['3-4-3',[['GK',50,88],['DF',20,64],['DF',50,64],['DF',80,64],['MF',18,43],['MF',39,43],['MF',61,43],['MF',82,43],['FW',20,16],['FW',50,16],['FW',80,16]]],['4-4-2',[['GK',50,88],['DF',12,64],['DF',37,64],['DF',63,64],['DF',88,64],['MF',18,43],['MF',39,43],['MF',61,43],['MF',82,43],['FW',38,16],['FW',62,16]]],['4-5-1',[['GK',50,88],['DF',12,64],['DF',37,64],['DF',63,64],['DF',88,64],['MF',12,43],['MF',31,43],['MF',50,43],['MF',69,43],['MF',88,43],['FW',50,16]]],['4-3-3',[['GK',50,88],['DF',12,64],['DF',37,64],['DF',63,64],['DF',88,64],['MF',25,43],['MF',50,43],['MF',75,43],['FW',20,16],['FW',50,16],['FW',80,16]]],['5-4-1',[['GK',50,88],['DF',10,64],['DF',30,64],['DF',50,64],['DF',70,64],['DF',90,64],['MF',18,43],['MF',39,43],['MF',61,43],['MF',82,43],['FW',50,16]]]]};
let selectedCount=6,formationSlots=[],subSlots=[],suppressClick=false;
function presetData(c,n){if(n==='自由配置')return formationSlots.length?JSON.parse(JSON.stringify(formationSlots)):[{role:'GK',x:50,y:88,player:''}];const f=(PRESETS[c]||[]).find(x=>x[0]===n);return f?f[1].map(a=>({role:a[0],x:a[1],y:a[2],player:''})):[]}
function fillPreset(){const c=selectedCount,s=document.getElementById('formationPreset');s.innerHTML=[...(PRESETS[c]||[]).map(x=>x[0]),'自由配置'].map(x=>`<option>${x}</option>`).join('')}
function resetFormation(){selectedCount=Number(document.getElementById('formationCount').value);fillPreset();formationSlots=presetData(selectedCount,document.getElementById('formationPreset').value);subSlots=Array(selectedCount).fill(null);renderFormation()}
function usedPlayers(){return formationSlots.map(x=>x.player).filter(Boolean)}
function usedSubPlayers(exceptIndex=-1){return subSlots.map((x,i)=>i===exceptIndex?'':x).filter(Boolean)}
function usedAllPlayers(exceptSub=-1){return unique([...usedPlayers(),...usedSubPlayers(exceptSub)])}
function renderPool(){const el=document.getElementById('playerPool');el.innerHTML='';db.players.forEach(p=>{const b=document.createElement('div');b.className='pool-player '+(usedAllPlayers().includes(p)?'used':'');b.textContent=p;b.dataset.player=p;b.onclick=()=>placeFromPool(p);b.onpointerdown=e=>startPoolDrag(e,p);el.appendChild(b)})}
function placeFromPool(p){if(usedAllPlayers().includes(p))return;const i=formationSlots.findIndex(s=>!s.player);if(i>=0){formationSlots[i].player=p;renderFormation()}else openPositionModal(null,p)}
function openPositionModal(index,presetPlayer=null){
 const list=document.getElementById('modalPlayers'),modal=document.getElementById('modalBack');
 list.innerHTML='';document.getElementById('modalTitle').textContent=index===null?'配置する位置を選択':(typeof index==='string'&&index.startsWith('sub-')?'交代予定':'この位置の選手');
 if(index===null){
  formationSlots.forEach((s,i)=>{const b=document.createElement('button');b.textContent=`${i+1}. ${s.role} ${s.player?'・'+s.player:''}`;b.onclick=()=>{if(!usedAllPlayers().includes(presetPlayer)){formationSlots[i].player=presetPlayer;modal.classList.remove('show');renderFormation()}};list.appendChild(b)})
 }else if(typeof index==='string'&&index.startsWith('sub-')){
  const si=Number(index.split('-')[1]), current=subSlots[si]||'';
  db.players.filter(p=>p===current||!usedPlayers().includes(p)&&!usedSubPlayers(si).includes(p)).forEach(p=>{const b=document.createElement('button');b.textContent=p;b.onclick=()=>{subSlots[si]=p;modal.classList.remove('show');renderFormation()};list.appendChild(b)});
  const clear=document.createElement('button');clear.textContent='空ける';clear.onclick=()=>{subSlots[si]=null;modal.classList.remove('show');renderFormation()};list.appendChild(clear)
 }else{
  const current=formationSlots[index].player;
  db.players.filter(p=>p===current||(!usedPlayers().filter((_,i)=>i!==index).includes(p)&&!usedSubPlayers().includes(p))).forEach(p=>{const b=document.createElement('button');b.textContent=p;b.onclick=()=>{formationSlots[index].player=p;modal.classList.remove('show');renderFormation()};list.appendChild(b)});
  const clear=document.createElement('button');clear.textContent='空ける';clear.onclick=()=>{formationSlots[index].player='';modal.classList.remove('show');renderFormation()};list.appendChild(clear)
 }
 modal.classList.add('show')
}
document.getElementById('modalClose').onclick=()=>document.getElementById('modalBack').classList.remove('show');
function renderFormation(){
 const pitch=document.getElementById('pitch');
 pitch.innerHTML='<div class="line center-line"></div><div class="line center-circle"></div><div class="line pa top"></div><div class="line pa bottom"></div><div class="line ga top"></div><div class="line ga bottom"></div><div class="line spot top"></div><div class="line spot bottom"></div>';
 formationSlots.forEach((s,i)=>{
  const d=document.createElement('div');d.className='position '+(!s.player?'empty':'');d.style.left=s.x+'%';d.style.top=s.y+'%';d.dataset.index=i;d.textContent=s.player||s.role;
  d.onclick=()=>{if(suppressClick){suppressClick=false;return}openPositionModal(i)};d.onpointerdown=e=>startPositionDrag(e,i);pitch.appendChild(d);
  const sub=document.createElement('div');sub.className='sub-marker '+(subSlots[i]?'filled':'');sub.style.left=s.x+'%';sub.style.top=Math.min(96,s.y+10)+'%';sub.textContent=subSlots[i]||'＋交代';sub.dataset.subIndex=i;
  sub.onclick=e=>{e.stopPropagation();if(suppressClick){suppressClick=false;return}openPositionModal('sub-'+i)};sub.onpointerdown=e=>startSubDrag(e,i);pitch.appendChild(sub)
 });
 renderPool();renderSaved5();renderCoaches()
}
let drag={kind:null,index:null,player:null,id:null,moved:false,ghost:null};
function makeGhost(text,x,y){const g=document.createElement('div');g.className='drag-ghost';g.textContent=text;g.style.left=x+'px';g.style.top=y+'px';document.body.appendChild(g);return g}
function startPositionDrag(e,i){if(e.pointerType==='mouse'&&e.button!==0)return;drag={kind:'position',index:i,id:e.pointerId,moved:false,ghost:makeGhost(formationSlots[i].player||formationSlots[i].role,e.clientX,e.clientY)};e.currentTarget.setPointerCapture?.(e.pointerId);document.addEventListener('pointermove',dragMove);document.addEventListener('pointerup',dragEnd);document.addEventListener('pointercancel',dragEnd)}
function startPoolDrag(e,p){if(e.pointerType==='mouse'&&e.button!==0)return;if(usedAllPlayers().includes(p))return;drag={kind:'pool',player:p,id:e.pointerId,moved:false,ghost:makeGhost(p,e.clientX,e.clientY)};e.currentTarget.setPointerCapture?.(e.pointerId);document.addEventListener('pointermove',dragMove);document.addEventListener('pointerup',dragEnd);document.addEventListener('pointercancel',dragEnd)}
function startSubDrag(e,i){if(e.pointerType==='mouse'&&e.button!==0)return;const p=subSlots[i];if(!p)return;drag={kind:'sub',index:i,player:p,id:e.pointerId,moved:false,ghost:makeGhost(p,e.clientX,e.clientY)};e.currentTarget.setPointerCapture?.(e.pointerId);document.addEventListener('pointermove',dragMove);document.addEventListener('pointerup',dragEnd);document.addEventListener('pointercancel',dragEnd)}
function dragMove(e){if(e.pointerId!==drag.id)return;drag.moved=true;if(drag.ghost){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px'}const t=document.elementFromPoint(e.clientX,e.clientY);document.querySelectorAll('.position.drop,.sub-marker.drop').forEach(x=>x.classList.remove('drop'));const pos=t?.closest('.position'),sub=t?.closest('.sub-marker');if(pos)pos.classList.add('drop');if(sub)sub.classList.add('drop')}
function dragEnd(e){
 if(e.pointerId!==drag.id)return;
 document.removeEventListener('pointermove',dragMove);document.removeEventListener('pointerup',dragEnd);document.removeEventListener('pointercancel',dragEnd);
 const els=document.elementsFromPoint?document.elementsFromPoint(e.clientX,e.clientY):[document.elementFromPoint(e.clientX,e.clientY)];const target=(els.find(x=>x.classList?.contains('position')||x.closest?.('.position'))||null)?.closest?.('.position') || (els.find(x=>x.classList?.contains('position'))||null);const subTarget=(els.find(x=>x.classList?.contains('sub-marker')||x.closest?.('.sub-marker'))||null)?.closest?.('.sub-marker') || (els.find(x=>x.classList?.contains('sub-marker'))||null);
 document.querySelectorAll('.position.drop,.sub-marker.drop').forEach(x=>x.classList.remove('drop'));if(drag.ghost){drag.ghost.remove();drag.ghost=null}
 if(drag.moved){
  if(drag.kind==='pool'&&target){const ti=Number(target.dataset.index);if(!usedAllPlayers().includes(drag.player)){formationSlots[ti].player=drag.player}}
  else if(drag.kind==='pool'&&subTarget){const si=Number(subTarget.dataset.subIndex);const oldSub=subSlots[si]||'';if(!usedAllPlayers().includes(drag.player)){subSlots[si]=drag.player}else if(oldSub===drag.player){subSlots[si]=drag.player}}
  else if(drag.kind==='position'&&target){const ti=Number(target.dataset.index);const a=formationSlots[drag.index],b=formationSlots[ti];[a.player,b.player]=[b.player,a.player]}
  else if(drag.kind==='position'&&subTarget){const si=Number(subTarget.dataset.subIndex),p=formationSlots[drag.index].player;if(p){const oldSub=subSlots[si];subSlots[si]=p;formationSlots[drag.index].player=oldSub||''}}
  else if(drag.kind==='sub'&&subTarget){const si=Number(subTarget.dataset.subIndex),a=subSlots[drag.index],b=subSlots[si];[subSlots[drag.index],subSlots[si]]=[b,a]}
  else if(drag.kind==='sub'&&target){const ti=Number(target.dataset.index),p=subSlots[drag.index];if(p){const old=formationSlots[ti].player;formationSlots[ti].player=p;subSlots[drag.index]=old||null}}
  renderFormation();suppressClick=true
 }else if(drag.kind==='pool'){placeFromPool(drag.player)}else if(drag.kind==='sub'){openPositionModal('sub-'+drag.index)}
 drag={kind:null,index:null,player:null,id:null,moved:false,ghost:null}
}
function renderCoaches(){
 const el=document.getElementById('coachList');if(!el)return;el.innerHTML='';
 if(!db.coaches.length){el.innerHTML='<span class="muted">設定からコーチを登録してください。</span>';return}
 db.coaches.forEach(c=>{const b=document.createElement('button');b.className='coach-chip '+(db.coachAttendance[c]?'present':'');b.textContent=(db.coachAttendance[c]?'✓ ':'○ ')+c;b.onclick=()=>{db.coachAttendance[c]=!db.coachAttendance[c];save();renderCoaches()};el.appendChild(b)})
}
function renderCoachReg(){const el=document.getElementById('coachRegList');if(!el)return;el.innerHTML=db.coaches.length?db.coaches.map((c,i)=>`<div class="player-row"><span>${i+1}. ${esc(c)}</span><button class="btn danger" onclick="removeCoach(${i})">削除</button></div>`).join(''):'<div class="empty">コーチが登録されていません。</div>'}
window.removeCoach=i=>{if(confirm(db.coaches[i]+'を削除しますか？')){delete db.coachAttendance[db.coaches[i]];db.coaches.splice(i,1);save();renderCoachReg();renderCoaches()}}
function renderSaved5(){
 const el=document.getElementById('saved5');
 const list=db.matches.slice(0,5).map(m=>({id:m.id,savedAt:m.id,count:m.count,preset:m.formation,slots:m.slots,subs:m.subs}));
 if(!list.length){el.innerHTML='<span class="muted" style="grid-column:1/-1">まだありません</span>';return}
 el.innerHTML=[0,1,2,3,4].map((_,i)=>list[i]?`<button class="${i===0?'active':''}" onclick="loadSaved(${list[i].id})">${i+1}</button>`:`<button disabled>${i+1}</button>`).join('')
}
window.loadSaved=id=>{const f=db.matches.find(x=>x.id===id);if(!f)return;selectedCount=Number(f.count)||6;document.getElementById('formationCount').value=selectedCount;fillPreset();document.getElementById('formationPreset').value=f.preset||'自由配置';formationSlots=JSON.parse(JSON.stringify(f.slots||[]));subSlots=Array(selectedCount).fill(null);(f.subs||[]).forEach((x,i)=>{if(i<subSlots.length)subSlots[i]=x||null});renderFormation()};
function fillRecentSelects(){const r=db.matches.slice(0,10);setSelect('tournamentSelect',unique(r.map(x=>x.tournament)),'大会名');setSelect('opponentSelect',unique(r.map(x=>x.opponent)),'対戦相手');setSelect('venueSelect',unique(r.map(x=>x.venue)),'会場')}
function setSelect(id,arr,label){const s=document.getElementById(id);s.innerHTML=`<option value="">${label}</option><option value="__new">＋新しく入力</option>`+arr.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
['tournament','opponent','venue'].forEach(k=>document.getElementById(k+'Select').onchange=e=>{const i=document.getElementById(k+'Input');i.classList.toggle('hidden',e.target.value!=='__new');if(e.target.value&&e.target.value!=='__new')i.value=e.target.value;if(e.target.value==='')i.value=''})
function getField(k){const s=document.getElementById(k+'Select'),i=document.getElementById(k+'Input');return s.value==='__new'||!s.value?i.value.trim():s.value}
function renderScorers(){const el=document.getElementById('scorers');const vals=[...el.querySelectorAll('select')].map(x=>x.value).filter(Boolean);el.innerHTML='';vals.forEach(v=>addScorer(v));if(!vals.length)updateScore()}
function addScorer(v=''){const row=document.createElement('div');row.className='scorer-row';const s=document.createElement('select');s.innerHTML='<option value="">選手</option>'+db.players.map(p=>`<option>${esc(p)}</option>`).join('');s.value=v;const b=document.createElement('button');b.className='btn danger';b.textContent='×';s.onchange=updateScore;b.onclick=()=>{row.remove();updateScore()};row.append(s,b);document.getElementById('scorers').append(row);updateScore()}
function updateScore(){document.getElementById('ourScore').value=[...document.querySelectorAll('#scorers select')].filter(x=>x.value).length}
document.getElementById('addScorer').onclick=()=>addScorer();
document.getElementById('oppUp').onclick=()=>{const e=document.getElementById('oppScore');e.value=Number(e.value||0)+1};
document.getElementById('oppDown').onclick=()=>{const e=document.getElementById('oppScore');e.value=Math.max(0,Number(e.value||0)-1)};
function fillFormationSelect(){const c=Number(document.getElementById('playerCount').value);document.getElementById('formationSelect').innerHTML=[...(PRESETS[c]||[]).map(x=>x[0]),'自由配置'].map(x=>`<option>${x}</option>`).join('');}
document.getElementById('playerCount').onchange=()=>{selectedCount=Number(document.getElementById('playerCount').value);document.getElementById('formationCount').value=selectedCount;fillFormationSelect();resetFormation()};document.getElementById('formationCount').onchange=resetFormation;document.getElementById('formationPreset').onchange=()=>{formationSlots=presetData(selectedCount,document.getElementById('formationPreset').value);subSlots=Array(selectedCount).fill(null);renderFormation()};document.getElementById('clearFormation').onclick=resetFormation;document.getElementById('clearSubs').onclick=()=>{subSlots=Array(selectedCount).fill(null);renderFormation()};
function saveMatch(){const match={id:Date.now(),tournament:getField('tournament'),opponent:getField('opponent'),venue:getField('venue'),date:document.getElementById('matchDate').value,time:document.getElementById('matchTime').value,count:selectedCount,formation:document.getElementById('formationPreset').value,ourScore:Number(document.getElementById('ourScore').value),oppScore:Number(document.getElementById('oppScore').value),scorers:[...document.querySelectorAll('#scorers select')].map(x=>x.value).filter(Boolean),memo:document.getElementById('matchMemo').value,slots:JSON.parse(JSON.stringify(formationSlots)),subs:[...subSlots],coaches:db.coaches.map(c=>({name:c,present:!!db.coachAttendance[c]}))};db.matches.unshift(match);db.savedFormations.unshift({id:match.id,savedAt:Date.now(),count:match.count,preset:match.formation,slots:JSON.parse(JSON.stringify(match.slots)),subs:[...match.subs]});db.savedFormations=db.savedFormations.slice(0,5);db.currentFormation=db.savedFormations[0];save();fillRecentSelects();renderSaved5();renderCalendar();showPage(1);alert('試合とフォーメーションを保存しました。')}
document.getElementById('saveMatch').onclick=saveMatch;
document.getElementById('openCoaches').onclick=()=>{document.getElementById('settingsHome').classList.add('hidden');document.getElementById('playerPage').style.display='none';document.getElementById('coachPage').style.display='block';renderCoachReg()};
document.getElementById('backCoaches').onclick=()=>{document.getElementById('coachPage').style.display='none';document.getElementById('settingsHome').classList.remove('hidden')};
document.getElementById('addCoach').onclick=()=>{const v=document.getElementById('newCoach').value.trim();if(!v)return;if(!db.coaches.includes(v))db.coaches.push(v);db.coachAttendance[v]=false;document.getElementById('newCoach').value='';save();renderCoachReg();renderCoaches()};
function renderPlayers(){const el=document.getElementById('playerList');el.innerHTML=db.players.length?db.players.map((p,i)=>`<div class="player-row"><span>${i+1}. ${esc(p)}</span><button class="btn danger" onclick="removePlayer(${i})">削除</button></div>`).join(''):'<div class="empty">選手が登録されていません。</div>'}
window.removePlayer=i=>{if(confirm(db.players[i]+'を削除しますか？')){db.players.splice(i,1);save();renderPlayers();renderScorers();renderFormation()}};document.getElementById('addPlayer').onclick=()=>{const v=document.getElementById('newPlayer').value.trim();if(!v)return;if(!db.players.includes(v))db.players.push(v);document.getElementById('newPlayer').value='';save();renderPlayers();renderScorers();renderFormation()};
let calDate=new Date();calDate.setDate(1);
function renderCalendar(){const y=calDate.getFullYear(),m=calDate.getMonth();document.getElementById('monthLabel').textContent=`${y}年 ${m+1}月`;const el=document.getElementById('calendar');const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();let h=['日','月','火','水','木','金','土'].map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<first;i++)h+=`<div class="day muted-day"><span class="day-num">${prev-first+i+1}</span></div>`;for(let d=1;d<=days;d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,ms=db.matches.filter(x=>x.date===ds);h+=`<button class="day ${ms.length?'has-match':''}" data-date="${ds}"><span class="day-num">${d}</span>${ms.slice(0,2).map(x=>`<span class="dot">${x.ourScore}vs${x.oppScore} ${esc(x.opponent||'試合')}</span>`).join('')}</button>`}const total=first+days;for(let i=0;i<(7-total%7)%7;i++)h+=`<div class="day muted-day"></div>`;el.innerHTML=h;el.querySelectorAll('.day[data-date]').forEach(b=>b.onclick=()=>showDay(b.dataset.date));}
function showDay(ds){const ms=db.matches.filter(x=>x.date===ds),el=document.getElementById('dayMatches');if(!ms.length){el.innerHTML='<div class="empty">この日の試合はありません。</div>';return}el.innerHTML=ms.map(m=>`<div class="match-item"><div class="match-top"><span>vs. ${esc(m.opponent||'対戦相手未入力')}</span><span>${m.ourScore}－${m.oppScore}</span></div><div class="match-sub">${esc(m.time||'')}　${esc(m.tournament||'')}　${esc(m.venue||'')}</div><div class="match-formation">${esc(m.formation||'')} / ${m.count}人制　先発：${(m.slots||[]).filter(s=>s.player).map(s=>esc(s.player)).join('、')||'なし'}<br>交代予定：${(m.subs||[]).filter(Boolean).map(esc).join('、')||'なし'}<br>コーチ：${(m.coaches||[]).filter(c=>c.present).map(c=>esc(c.name)).join('、')||'出席なし'}</div><div class="actions" style="margin-top:5px"><button class="btn" onclick="reuseMatch(${m.id})">この配置を使う</button><button class="btn danger" onclick="deleteMatch(${m.id})">削除</button></div></div>`).join('')}
window.reuseMatch=id=>{const m=db.matches.find(x=>x.id===id);if(!m)return;selectedCount=Number(m.count)||6;document.getElementById('playerCount').value=selectedCount;document.getElementById('formationCount').value=selectedCount;fillFormationSelect();fillPreset();document.getElementById('formationSelect').value=m.formation||'自由配置';document.getElementById('formationPreset').value=m.formation||'自由配置';formationSlots=JSON.parse(JSON.stringify(m.slots||[]));subSlots=Array(selectedCount).fill(null);(m.subs||[]).forEach((x,i)=>{if(i<subSlots.length)subSlots[i]=x||null});renderFormation();showPage(0)};
window.deleteMatch=id=>{if(confirm('この試合を削除しますか？')){db.matches=db.matches.filter(x=>x.id!==id);db.savedFormations=db.savedFormations.filter(x=>x.id!==id);save();fillRecentSelects();renderCalendar();showDay(document.querySelector('#calendar .has-match')?.dataset.date||'');}};
function showPage(i){document.getElementById('pages').style.transform=`translateX(-${i*33.333333}%)`;document.querySelectorAll('#nav button').forEach((b,n)=>b.classList.toggle('active',n===i));currentPage=i;requestAnimationFrame(()=>window.scrollTo({top:0,behavior:'instant'}))}
let currentPage=0,startX=0,startY=0;document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>showPage(Number(b.dataset.page)));document.getElementById('pages').addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});document.getElementById('pages').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){let n=currentPage+(dx<0?1:-1);n=Math.max(0,Math.min(2,n));showPage(n)}},{passive:true});
document.getElementById('openPlayers').onclick=()=>{document.getElementById('settingsHome').classList.add('hidden');document.getElementById('playerPage').style.display='block'};document.getElementById('backSettings').onclick=()=>{document.getElementById('playerPage').style.display='none';document.getElementById('settingsHome').classList.remove('hidden')};
document.getElementById('prevMonth').onclick=()=>{calDate.setMonth(calDate.getMonth()-1);renderCalendar()};document.getElementById('nextMonth').onclick=()=>{calDate.setMonth(calDate.getMonth()+1);renderCalendar()};
document.getElementById('exportData').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='soccer-manager-backup.json';a.click()};document.getElementById('importData').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);db.players=db.players||[];db.coaches=db.coaches||[];db.coachAttendance=db.coachAttendance||{};db.matches=db.matches||[];db.savedFormations=db.savedFormations||[];save();location.reload()}catch(x){alert('読み込みに失敗しました')}};r.readAsText(f)};document.getElementById('deleteData').onclick=()=>{if(confirm('選手・試合履歴など全データを削除します。よろしいですか？')){localStorage.removeItem(KEY);location.reload()}};
fillRecentSelects();fillFormationSelect();document.getElementById('formationCount').value=6;resetFormation();renderScorers();renderPlayers();renderCoaches();renderCoachReg();renderCalendar();const td=new Date();document.getElementById('matchDate').value=`${td.getFullYear()}-${String(td.getMonth()+1).padStart(2,'0')}-${String(td.getDate()).padStart(2,'0')}`;
</script>
